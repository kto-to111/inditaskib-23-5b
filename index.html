<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant (Global)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; padding: 50px; background: #f4f7f6; color: #333; }
        .app-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 400px; }
        #status { display: block; margin-bottom: 20px; font-weight: bold; color: #7f8c8d; transition: 0.3s; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; width: 100%; transition: 0.2s; font-weight: bold; }
        #startBtn { background: #2ecc71; color: white; margin-bottom: 10px; }
        #startBtn:hover { background: #27ae60; }
        #stopBtn { background: #e74c3c; color: white; display: none; }
        #stopBtn:hover { background: #c0392b; }
        #chat-box { margin-top: 25px; padding: 15px; background: #f9f9f9; border-radius: 10px; min-height: 80px; border-left: 5px solid #3498db; text-align: left; font-style: italic; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>AI Assistant</h1>
        <span id="status">Готов к подключению</span>
        
        <div id="chat-box">Нажмите "Начать", чтобы установить связь...</div>
        <br>
        
        <button id="startBtn" class="btn">Начать разговор</button>
        <button id="stopBtn" class="btn">Положить трубку</button>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ СВЯЗИ ---
        // Замените на ваш адрес ngrok БЕЗ https://
        const REMOTE_SERVER = "https://shavable-lupita-pseudomedievally.ngrok-free.dev"; 

        let socket, audioContext, microphone, processor, currentAudio;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');

        async function closeConnection() {
            if (microphone) microphone.getTracks().forEach(t => t.stop());
            if (socket) socket.close();
            if (audioContext) audioContext.close();
            if (currentAudio) currentAudio.pause();
            
            startBtn.disabled = false;
            stopBtn.style.display = 'none';
            status.innerText = "Связь завершена";
            status.style.color = "#7f8c8d";
        }

        startBtn.onclick = async () => {
            try {
                startBtn.disabled = true;
                stopBtn.style.display = 'block';
                status.innerText = "Подключение к серверу...";
                status.style.color = "#3498db";

                // 1. Установка WebSocket соединения
                socket = new WebSocket(`wss://${REMOTE_SERVER}/ws`);

                // 2. Доступ к микрофону
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });
                microphone = stream;

                // 3. Настройка аудио-потока (PCM 44100Hz)
                audioContext = new AudioContext({ sampleRate: 44100 });
                const source = audioContext.createMediaStreamSource(stream);
                // Буфер 8192 помогает избежать прерываний на слабом интернете
                processor = audioContext.createScriptProcessor(8192, 1, 1);

                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcmData = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            // Нормализация и конвертация в Int16 для Vosk
                            let s = Math.max(-1, Math.min(1, inputData[i]));
                            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        socket.send(pcmData.buffer);
                    }
                };

                // 4. Обработка ответов от ИИ
                socket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === "play") {
                        chatBox.innerText = "ИИ: " + data.text;
                        
                        if (currentAudio) currentAudio.pause();
                        // Важно: берем аудио файл с вашего удаленного сервера
                        const audioUrl = `https://${REMOTE_SERVER}${data.url}?t=${Date.now()}`;
                        currentAudio = new Audio(audioUrl);
                        await currentAudio.play();
                    }
                };

                socket.onclose = () => {
                    console.log("WebSocket закрыт");
                    closeConnection();
                };

                status.innerText = "Слушаю вас...";
                status.style.color = "#2ecc71";

            } catch (err) {
                console.error("Ошибка:", err);
                alert("Не удалось запустить: проверьте микрофон и адрес сервера в коде.");
                closeConnection();
            }
        };

        stopBtn.onclick = closeConnection;
    </script>
</body>
</html>
