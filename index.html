<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .app-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 400px; }
        #status { display: block; margin-bottom: 20px; font-weight: bold; color: #7f8c8d; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; width: 100%; font-weight: bold; margin-bottom: 10px; }
        #startBtn { background: #2ecc71; color: white; }
        #stopBtn { background: #e74c3c; color: white; display: none; }
        #chat-box { margin-top: 25px; padding: 15px; background: #f9f9f9; border-radius: 10px; min-height: 80px; border-left: 5px solid #3498db; text-align: left; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>AI Assistant</h1>
        <span id="status">Готов</span>
        <div id="chat-box">Нажмите "Начать"</div>
        <br>
        <button id="startBtn" class="btn">Начать разговор</button>
        <button id="stopBtn" class="btn">Завершить</button>
    </div>

    <script>
        // --- ИСПРАВЛЕННАЯ НАСТРОЙКА АДРЕСА ---
        // Вставьте сюда вашу ссылку из ngrok (можно с https, можно без)
        let REMOTE_SERVER = "shavable-lupita-pseudomedievally.ngrok-free.dev"; 
        
        // Очищаем адрес от протоколов, если они есть
        REMOTE_SERVER = REMOTE_SERVER.replace("https://", "").replace("http://", "");

        let socket, audioContext, microphone, processor, currentAudio;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');

        async function closeConnection() {
            if (microphone) microphone.getTracks().forEach(t => t.stop());
            if (socket) socket.close();
            if (audioContext) audioContext.close();
            if (currentAudio) currentAudio.pause();
            startBtn.disabled = false;
            stopBtn.style.display = 'none';
            status.innerText = "Связь завершена";
        }

        startBtn.onclick = async () => {
            try {
                startBtn.disabled = true;
                stopBtn.style.display = 'block';
                status.innerText = "Подключение...";

                // Формируем правильный WebSocket URL
                socket = new WebSocket(`wss://${REMOTE_SERVER}/ws`);

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                microphone = stream;

                audioContext = new AudioContext({ sampleRate: 44100 });
                const source = audioContext.createMediaStreamSource(stream);
                processor = audioContext.createScriptProcessor(8192, 1, 1);

                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcmData = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            let s = Math.max(-1, Math.min(1, inputData[i]));
                            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        socket.send(pcmData.buffer);
                    }
                };

                socket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === "play") {
                        console.log("Получена ссылка на аудио:", data.url);
                        chatBox.innerText = "ИИ: " + data.text;
                        if (currentAudio) currentAudio.pause();
                        // Полный URL для аудиофайла
                        const audioUrl = `https://${REMOTE_SERVER}${data.url}?t=${Date.now()}`;
                        console.log("Пытаюсь воспроизвести:", audioUrl);
                        
                        currentAudio = new Audio(audioUrl);
                        currentAudio.play().catch(e => {
                            console.error("Ошибка воспроизведения аудио:", e);
                            status.innerText = "Ошибка звука! Кликните на страницу.";
                        });
                    }
                };

                socket.onclose = () => closeConnection();
                status.innerText = "Слушаю...";

            } catch (err) {
                console.error(err);
                alert("Ошибка подключения. Проверьте адрес ngrok и микрофон.");
                closeConnection();
            }
        };

        stopBtn.onclick = closeConnection;
    </script>
</body>
</html>
