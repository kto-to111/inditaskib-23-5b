<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; padding: 50px; background: #f0f2f5; color: #333; }
        .app-container { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 400px; }
        #status { display: block; margin-bottom: 20px; font-weight: bold; color: #7f8c8d; height: 20px; }
        .btn { padding: 18px; font-size: 18px; cursor: pointer; border: none; border-radius: 12px; width: 100%; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        #startBtn { background: #007bff; color: white; }
        #startBtn:disabled { background: #ccc; cursor: not-allowed; }
        #stopBtn { background: #dc3545; color: white; display: none; }
        #chat-box { margin-top: 25px; padding: 20px; background: #f8f9fa; border-radius: 12px; min-height: 100px; border-left: 6px solid #007bff; text-align: left; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Голосовой ИИ</h1>
        <span id="status">Готов к работе</span>
        <div id="chat-box">Нажмите "Начать разговор", чтобы ИИ вас услышал.</div>
        <br>
        <button id="startBtn" class="btn">Начать разговор</button>
        <button id="stopBtn" class="btn">Завершить звонок</button>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        let REMOTE_ADDR = "https://shavable-lupita-pseudomedievally.ngrok-free.dev"; 
        // Очистка адреса от протоколов, если они случайно введены
        REMOTE_ADDR = REMOTE_ADDR.replace("https://", "").replace("http://", "").replace("/", "");

        let socket, audioContext, microphone, processor, currentAudio;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');

        async function closeConnection() {
            console.log("Завершение сессии...");
            
            if (microphone) {
                microphone.getTracks().forEach(t => t.stop());
                microphone = null;
            }

            if (socket) {
                if (socket.readyState === WebSocket.OPEN) socket.close();
                socket = null;
            }

            if (audioContext && audioContext.state !== 'closed') {
                await audioContext.close();
                audioContext = null;
            }

            if (currentAudio) {
                currentAudio.pause();
                currentAudio.src = "";
                currentAudio = null;
            }
            
            startBtn.disabled = false;
            stopBtn.style.display = 'none';
            status.innerText = "Связь завершена";
            status.style.color = "#7f8c8d";
        }

        startBtn.onclick = async () => {
            try {
                // Активация аудио-контекста по клику пользователя (важно для браузеров)
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                
                startBtn.disabled = true;
                stopBtn.style.display = 'block';
                status.innerText = "Установка соединения...";
                status.style.color = "#007bff";

                socket = new WebSocket(`wss://${REMOTE_ADDR}/ws`);

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });
                microphone = stream;

                const source = audioContext.createMediaStreamSource(stream);
                // Буфер 8192 для стабильности на ngrok
                processor = audioContext.createScriptProcessor(8192, 1, 1);

                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcmData = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            let s = Math.max(-1, Math.min(1, inputData[i]));
                            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        socket.send(pcmData.buffer);
                    }
                };

                socket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === "play") {
                        chatBox.innerText = "ИИ: " + data.text;
                        
                        const audioUrl = `https://${REMOTE_ADDR}${data.url}?t=${Date.now()}`;
                        console.log("Воспроизведение:", audioUrl);

                        if (currentAudio) {
                            currentAudio.pause();
                        }

                        currentAudio = new Audio();
                        currentAudio.crossOrigin = "anonymous";
                        currentAudio.src = audioUrl;

                        currentAudio.play().catch(err => {
                            console.error("Ошибка аудио:", err);
                            // Если файл не успел прогрузиться (404), пробуем еще раз через 1 сек
                            setTimeout(() => currentAudio.play(), 1000);
                        });
                    }
                };

                socket.onclose = () => closeConnection();
                socket.onerror = () => {
                    alert("Ошибка WebSocket. Проверьте адрес сервера и ngrok.");
                    closeConnection();
                };

                status.innerText = "Слушаю вас...";
                status.style.color = "#28a745";

            } catch (err) {
                console.error("Критическая ошибка:", err);
                alert("Нет доступа к микрофону или серверу.");
                closeConnection();
            }
        };

        stopBtn.onclick = closeConnection;
    </script>
</body>
</html>
