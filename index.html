<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; background: #f0f2f5; color: #333; }
        .app-container { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 400px; }
        #status { display: block; margin-bottom: 20px; font-weight: bold; color: #7f8c8d; height: 24px; }
        .btn { padding: 18px; font-size: 18px; cursor: pointer; border: none; border-radius: 12px; width: 100%; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        #startBtn { background: #007bff; color: white; }
        #startBtn:disabled { background: #ccc; cursor: not-allowed; }
        #stopBtn { background: #dc3545; color: white; display: none; }
        #chat-box { margin-top: 25px; padding: 20px; background: #f8f9fa; border-radius: 12px; min-height: 100px; border-left: 6px solid #007bff; text-align: left; line-height: 1.5; font-size: 16px; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Голосовой ИИ</h1>
        <span id="status">Готов к работе</span>
        <div id="chat-box">Нажмите "Начать разговор", чтобы ИИ вас услышал.</div>
        <br>
        <button id="startBtn" class="btn">Начать разговор</button>
        <button id="stopBtn" class="btn">Завершить звонок</button>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        // Вставьте сюда вашу ссылку ngrok (с https или без)
        let REMOTE_ADDR = "shavable-lupita-pseudomedievally.ngrok-free.dev"; 
        
        // Очистка адреса
        REMOTE_ADDR = REMOTE_ADDR.replace("https://", "").replace("http://", "").split('/')[0];

        let socket, audioContext, microphone, processor, currentAudio;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');

        async function closeConnection() {
            console.log("Завершение сессии...");
            if (microphone) { microphone.getTracks().forEach(t => t.stop()); microphone = null; }
            if (socket) { if (socket.readyState === WebSocket.OPEN) socket.close(); socket = null; }
            if (audioContext && audioContext.state !== 'closed') { await audioContext.close(); audioContext = null; }
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            
            startBtn.disabled = false;
            stopBtn.style.display = 'none';
            status.innerText = "Связь завершена";
            status.style.color = "#7f8c8d";
        }

        startBtn.onclick = async () => {
            try {
                // Инициализируем аудио по клику
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                
                startBtn.disabled = true;
                stopBtn.style.display = 'block';
                status.innerText = "Установка соединения...";
                status.style.color = "#007bff";

                socket = new WebSocket(`wss://${REMOTE_ADDR}/ws`);

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });
                microphone = stream;

                const source = audioContext.createMediaStreamSource(stream);
                processor = audioContext.createScriptProcessor(8192, 1, 1);

                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcmData = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            let s = Math.max(-1, Math.min(1, inputData[i]));
                            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        socket.send(pcmData.buffer);
                    }
                };

                socket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === "play") {
                        chatBox.innerText = "ИИ: " + data.text;
                        
                        const audioUrl = `https://${REMOTE_ADDR}${data.url}?t=${Date.now()}`;
                        console.log("Загрузка аудио:", audioUrl);

                        try {
                            // ИСПОЛЬЗУЕМ FETCH ДЛЯ ОБХОДА ПРЕДУПРЕЖДЕНИЯ NGROK
                            const response = await fetch(audioUrl, {
                                headers: { 'ngrok-skip-browser-warning': 'true' }
                            });
                            
                            if (!response.ok) throw new Error("Файл не найден на сервере");
                            
                            const blob = await response.blob();
                            const blobUrl = URL.createObjectURL(blob);

                            if (currentAudio) currentAudio.pause();
                            currentAudio = new Audio(blobUrl);
                            await currentAudio.play();
                        } catch (err) {
                            console.error("Ошибка загрузки аудио:", err);
                        }
                    }
                };

                socket.onclose = () => closeConnection();
                status.innerText = "Слушаю вас...";
                status.style.color = "#28a745";

            } catch (err) {
                console.error("Критическая ошибка:", err);
                alert("Нет доступа к микрофону или серверу.");
                closeConnection();
            }
        };

        stopBtn.onclick = closeConnection;
    </script>
</body>
</html>
