<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LiveKit Audio Chat</title>
<script type="module">
import { Room, RoomEvent } from "https://cdn.jsdelivr.net/npm/livekit-client@1.15.13/dist/livekit-client.esm.mjs";

const SERVER_URL = "https://inditaskib-23-5b-production.up.railway.app"; // твой FastAPI сервер
const LIVEKIT_WS = "wss://test-fjir13jl.livekit.cloud"; // твоя LiveKit комната
const AUDIO_ONLY = true;

// Ждём клика пользователя для старта аудио
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("joinBtn");
    btn.addEventListener("click", init);
});

async function init() {
    try {
        // Получаем JWT токен
        const res = await fetch(`${SERVER_URL}/get-token?identity=user123`);
        if (!res.ok) throw new Error("Could not fetch token");
        const data = await res.json();

        const room = new Room();

        room.on(RoomEvent.Disconnected, () => console.log("Disconnected"));
        room.on(RoomEvent.ParticipantConnected, participant => {
            console.log("Participant connected:", participant.identity);
        });

        await room.connect(LIVEKIT_WS, data.token, {
            audio: true,
            video: false,
            autoSubscribe: true,
        });

        console.log("Connected to room:", room.name);

        // Подписка на существующих участников
        room.participants.forEach(participant => {
            participant.tracks.forEach(pub => {
                if (pub.isSubscribed && pub.track.kind === "audio") {
                    const el = pub.track.attach();
                    document.body.appendChild(el);
                }
            });

            participant.on(RoomEvent.TrackSubscribed, track => {
                if (track.kind === "audio") {
                    const audioEl = track.attach();
                    document.body.appendChild(audioEl);
                }
            });
        });

    } catch (err) {
        console.error("Error connecting to LiveKit:", err);
    }
}
</script>
</head>
<body>
<h1>LiveKit Audio Chat</h1>
<button id="joinBtn">Присоединиться к комнате</button>
<p>Нажмите кнопку, чтобы подключиться и включить аудио.</p>
</body>
</html>
