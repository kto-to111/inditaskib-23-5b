<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Voice Assistant</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: #f0f2f5; margin: 0; display: flex; 
            align-items: center; justify-content: center; min-height: 100vh; 
        }
        .card { 
            background: white; width: 90%; max-width: 400px; padding: 30px; 
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; 
        }
        #chat { 
            background: #f8f9fa; padding: 20px; border-radius: 20px; 
            min-height: 120px; margin-bottom: 25px; text-align: left; 
            font-size: 17px; border: 1px solid #eee; line-height: 1.4; color: #333;
        }
        .record-btn { 
            width: 90px; height: 90px; border-radius: 50%; border: none; 
            background: #007AFF; color: white; font-size: 35px; cursor: pointer;
            transition: all 0.2s ease; box-shadow: 0 5px 15px rgba(0,122,255,0.3);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .record-btn:active, .record-btn.active { 
            background: #FF3B30; transform: scale(1.1); 
            box-shadow: 0 0 25px rgba(255,59,48,0.5); 
        }
        .status-text { margin-top: 15px; font-size: 14px; color: #888; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <div id="chat">Нажмите и удерживайте кнопку, чтобы говорить...</div>
        <button id="recordBtn" class="record-btn">🎤</button>
        <div class="status-text" id="status">ЗАЖМИТЕ ДЛЯ ЗАПИСИ</div>
    </div>

    <script>
        // --- УКАЖИТЕ ВАШ АДРЕС NGROK ТУТ ---
        let REMOTE_ADDR = "shavable-lupita-pseudomedievally.ngrok-free.dev"; 
        REMOTE_ADDR = REMOTE_ADDR.replace("https://", "").replace("http://", "").split('/')[0];

        let socket, mediaRecorder, audioChunks = [], currentAudio;

        const btn = document.getElementById('recordBtn');
        const chat = document.getElementById('chat');
        const statusText = document.getElementById('status');

        // Инициализация WebSocket
        function connect() {
            socket = new WebSocket(`wss://${REMOTE_ADDR}/ws`);
            socket.onmessage = async (e) => {
                const data = JSON.parse(e.data);
                if (data.event === "play") {
                    chat.innerText = data.text;
                    statusText.innerText = "ИИ ОТВЕЧАЕТ";
                    
                    try {
                        const res = await fetch(`https://${REMOTE_ADDR}${data.url}?t=${Date.now()}`, { 
                            headers: {'ngrok-skip-browser-warning': 'true'} 
                        });
                        const blob = await res.blob();
                        if (currentAudio) currentAudio.pause();
                        currentAudio = new Audio(URL.createObjectURL(blob));
                        await currentAudio.play();
                    } catch (err) { console.error("Ошибка звука:", err); }
                    
                    statusText.innerText = "ГОТОВ";
                }
            };
            socket.onclose = () => setTimeout(connect, 2000); // Автопереподключение
        }
        connect();

        async function startRecording() {
            try {
                // Выбор кодека, который понимает Whisper
                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
                                 ? 'audio/webm;codecs=opus' : 'audio/webm';
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    if (audioBlob.size > 1000 && socket.readyState === WebSocket.OPEN) {
                        const buffer = await audioBlob.arrayBuffer();
                        socket.send(buffer);
                        console.log("Отправлено байт:", buffer.byteLength);
                    }
                    // Закрываем микрофон
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                btn.classList.add('active');
                statusText.innerText = "СЛУШАЮ...";
                statusText.style.color = "#FF3B30";
            } catch (err) {
                alert("Разрешите доступ к микрофону!");
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                btn.classList.remove('active');
                statusText.innerText = "ОБРАБОТКА...";
                statusText.style.color = "#007AFF";
            }
        }

        // События для ПК
        btn.addEventListener('mousedown', startRecording);
        btn.addEventListener('mouseup', stopRecording);
        btn.addEventListener('mouseleave', stopRecording);

        // События для телефонов
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
    </script>
</body>
</html>
