<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LiveKit Audio Chat</title>
  <script type="module">
    import { Room } from "https://cdn.jsdelivr.net/npm/livekit-client@1.15.13/dist/livekit-client.esm.mjs";

    const SERVER_URL = "https://inditaskib-23-5b-production.up.railway.app"; // FastAPI
    const LIVEKIT_WS = "wss://test-fjir13jl.livekit.cloud"; // твой LiveKit сервер

    async function init() {
      try {
        // 1️⃣ Получаем токен с FastAPI
        const res = await fetch(`${SERVER_URL}/get-token?identity=user123`);
        if (!res.ok) throw new Error(`Failed to get token: ${res.status}`);
        const data = await res.json();
        const token = data.token;

        console.log("Получен токен:", token);

        // 2️⃣ Создаем комнату LiveKit
        const room = new Room();

        // 3️⃣ Подключаемся к комнате
        await room.connect(LIVEKIT_WS, token, { audio: true, video: false });
        console.log("Подключено к комнате:", room.name);

        // 4️⃣ Подключаем аудио участников
        room.on("participantConnected", participant => {
          participant.audioTracks.forEach(pub => {
            if (pub.isSubscribed) {
              const el = pub.track.attach();
              document.body.appendChild(el);
            }
          });

          participant.on("trackSubscribed", track => {
            const el = track.attach();
            document.body.appendChild(el);
          });
        });

        // 5️⃣ Подключаем свой микрофон
        const localTrack = await Room.createLocalTracks({ audio: true, video: false });
        await room.localParticipant.publishTracks(localTrack);

      } catch (err) {
        console.error("Ошибка подключения к LiveKit:", err);
      }
    }

    // Запуск после user gesture (для AudioContext)
    document.addEventListener("click", () => {
      init();
    });
  </script>
</head>
<body>
  <h1>LiveKit Audio Chat</h1>
  <p>Нажмите на страницу для подключения аудио</p>
</body>
</html>
