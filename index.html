<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Voice Assistant</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: #f0f2f5; margin: 0; display: flex; 
            align-items: center; justify-content: center; min-height: 100vh; 
        }
        .card { 
            background: white; width: 90%; max-width: 400px; padding: 30px; 
            border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; 
        }
        #chat { 
            background: #f8f9fa; padding: 20px; border-radius: 20px; 
            min-height: 140px; margin-bottom: 25px; text-align: left; 
            font-size: 17px; border: 1px solid #eee; line-height: 1.4; color: #333;
            max-height: 250px; overflow-y: auto;
        }
        .record-btn { 
            width: 90px; height: 90px; border-radius: 50%; border: none; 
            background: #007AFF; color: white; font-size: 35px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,122,255,0.3);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .record-btn.active { 
            background: #FF3B30; 
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        .status-text { margin-top: 15px; font-size: 14px; color: #888; font-weight: 700; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="chat">Нажмите на микрофон, чтобы начать постоянный диалог...</div>
        <button id="recordBtn" class="record-btn">🎤</button>
        <div class="status-text" id="status">ВЫКЛЮЧЕНО</div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        let REMOTE_ADDR = "shavable-lupita-pseudomedievally.ngrok-free.dev"; 
        REMOTE_ADDR = REMOTE_ADDR.replace("https://", "").replace("http://", "").split('/')[0];

        let socket, mediaRecorder, currentAudio, isRecording = false;
        let audioChunks = [];

        const btn = document.getElementById('recordBtn');
        const chat = document.getElementById('chat');
        const statusText = document.getElementById('status');

        // Инициализация WebSocket
        function connect() {
            socket = new WebSocket(`wss://${REMOTE_ADDR}/ws`);
            socket.onmessage = async (e) => {
                const data = JSON.parse(e.data);
                if (data.event === "play") {
                    chat.innerText = "ИИ: " + data.text;
                    try {
                        const res = await fetch(`https://${REMOTE_ADDR}${data.url}?t=${Date.now()}`, { 
                            headers: {'ngrok-skip-browser-warning': 'true'} 
                        });
                        const blob = await res.blob();
                        if (currentAudio) currentAudio.pause();
                        currentAudio = new Audio(URL.createObjectURL(blob));
                        await currentAudio.play();
                    } catch (err) { console.error("Ошибка аудио:", err); }
                }
            };
            socket.onclose = () => {
                console.log("WebSocket закрыт, переподключение...");
                setTimeout(connect, 2000);
            };
        }
        connect();

        async function startFragment() {
            if (!isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
                                 ? 'audio/webm;codecs=opus' : 'audio/webm';
                
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    
                    // Отправляем только если кусок весит больше 2кб (защита от пустоты)
                    if (audioBlob.size > 2000 && socket.readyState === WebSocket.OPEN) {
                        const buffer = await audioBlob.arrayBuffer();
                        socket.send(buffer);
                        console.log("Фрагмент отправлен, размер:", audioBlob.size);
                    }
                    
                    // Освобождаем микрофон и сразу запускаем новый фрагмент
                    stream.getTracks().forEach(t => t.stop());
                    if (isRecording) startFragment();
                };

                // Записываем кусок длиной 4 секунды
                mediaRecorder.start();
                setTimeout(() => {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 4000);

            } catch (err) {
                console.error("Ошибка доступа:", err);
                isRecording = false;
                updateUI();
            }
        }

        function updateUI() {
            if (isRecording) {
                btn.classList.add('active');
                statusText.innerText = "СЛУШАЮ (ПОСТОЯННО)";
                statusText.style.color = "#FF3B30";
            } else {
                btn.classList.remove('active');
                statusText.innerText = "ВЫКЛЮЧЕНО";
                statusText.style.color = "#888";
            }
        }

        btn.addEventListener('click', () => {
            isRecording = !isRecording;
            updateUI();
            if (isRecording) {
                startFragment();
            } else if (mediaRecorder) {
                mediaRecorder.stop();
            }
        });
    </script>
</body>
</html>
